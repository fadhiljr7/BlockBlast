name: Deploy website to GitHub Pages

# The site is a Vite + React app inside a repository whose root is the iOS app,
# so it is built here and published with an Actions workflow rather than the
# branch-folder setting (which only supports / or /docs).
on:
  push:
    branches: [main]
    paths:
      - 'blocckblastweb/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: blocckblastweb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blocckblastweb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` type-checks, bundles with the /BlockBlast/ base that a
      # Pages project site needs, and copies index.html to 404.html so a hard
      # refresh on /support is handed back to the router.
      - name: Build
        run: npm run build

      - name: Verify the build output
        run: |
          set -e
          for file in index.html 404.html appLogo.png; do
            test -f "dist/$file" || { echo "::error::missing dist/$file"; exit 1; }
          done
          # The one failure that still serves a page: a build made with the wrong
          # base, where index.html loads and every asset 404s into a blank screen.
          grep -q 'src="/BlockBlast/assets/' dist/index.html \
            || { echo "::error::dist/index.html is not built for the /BlockBlast/ base path"; exit 1; }
          echo "Build output looks correct."

      # enablement: true lets the workflow create the Pages site itself on the
      # first run. Without it the action only reads the config, and fails with
      # "Get Pages site failed / Not Found" until someone enables Pages by hand.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: blocckblastweb/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
