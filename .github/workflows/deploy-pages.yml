name: Deploy website to GitHub Pages

# The site is a Vite + React app inside a repository whose root is the iOS app,
# so it is built here and published with an Actions workflow rather than the
# branch-folder setting (which only supports / or /docs).
on:
  push:
    branches: [main]
    paths:
      - 'blockblastweb/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: blockblastweb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockblastweb/package-lock.json

      # eslint-plugin-jsx-a11y has not declared ESLint 10 in its peer range yet,
      # so a strict install refuses to resolve the tree.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Check the demo board rules
        run: npm run check

      # Builds the client, builds the SSR bundle, then prerenders every route to
      # static HTML with its own metadata, plus sitemap.xml and robots.txt.
      - name: Build and prerender
        run: npm run build

      - name: Verify the prerendered output
        run: |
          set -e
          for file in index.html support/index.html privacy/index.html 404.html sitemap.xml robots.txt og-card.png; do
            test -f "dist/$file" || { echo "::error::missing dist/$file"; exit 1; }
          done
          # A prerendered page must contain real content, not an empty shell —
          # this is the check that catches the SSR step silently degrading.
          grep -q 'Playable by Everyone' dist/index.html \
            || { echo "::error::index.html has no prerendered hero copy"; exit 1; }
          grep -q 'FAQPage' dist/support/index.html \
            || { echo "::error::support page is missing its FAQ structured data"; exit 1; }
          echo "Prerendered output looks complete."

      # enablement: true lets the workflow create the Pages site itself on the
      # first run. Without it the action only reads the config, and fails with
      # "Get Pages site failed / Not Found" until someone enables Pages by hand.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: blockblastweb/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
