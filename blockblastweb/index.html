<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Declares what the page can rely on, before the first paint.

      The pages are prerendered, so their content is on screen before the bundle
      arrives. Two kinds of element need to know whether JavaScript is actually
      coming:

        `js`           — anything that JavaScript will make interactive, such as
                         the FAQ accordions. Without it they render fully open,
                         so the answers are readable with no JavaScript at all.
        `motion-ready` — anything that animates in. Without it nothing is hidden
                         waiting for an animation that will never run.

      Both are removed again if the app has not booted within five seconds, so a
      blocked or failed bundle can never leave a visitor with content they
      cannot read or open.
    -->
    <script>
      (function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            root.classList.add('motion-ready')
          }
        } catch (error) {
          /* No matchMedia: leave the content visible and unanimated. */
        }
        window.__motionFallback = setTimeout(function () {
          root.classList.remove('motion-ready')
          root.classList.remove('js')
        }, 5000)
      })()
    </script>

    <!--
      Replaced per route by scripts/prerender.mjs. The values here are the
      landing page's, so `vite dev` and any un-prerendered fallback still carry
      correct metadata.
    -->
    <!--app-head-->
    <title>Block Blast: Accessible Edition — A Puzzle Game for Everyone</title>
    <meta
      name="description"
      content="Play Block Blast, the puzzle game designed for blind players, color-blind players, and everyone else. Sonic navigation, pattern blocks, and three ways to play."
    />
    <!--/app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
