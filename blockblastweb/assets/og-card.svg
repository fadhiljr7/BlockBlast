<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Block Blast: Accessible Edition — Play Without Limits">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12122A"/><stop offset="1" stop-color="#0A0A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#E94560" stop-opacity=".22"/><stop offset="1" stop-color="#E94560" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.4" fill="#7A1B29"/><circle cx="18" cy="6" r="3.4" fill="#7A1B29"/>
      <circle cx="6" cy="18" r="3.4" fill="#7A1B29"/><circle cx="18" cy="18" r="3.4" fill="#7A1B29"/>
    </pattern>
    <pattern id="lines" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect y="3" width="24" height="5" fill="#123E7A"/><rect y="15" width="24" height="5" fill="#123E7A"/>
    </pattern>
    <pattern id="vlines" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" width="5" height="24" fill="#12522A"/><rect x="15" width="5" height="24" fill="#12522A"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(772 168)">
    <rect width="120" height="120" rx="26" fill="#ED424F"/><rect width="120" height="120" rx="26" fill="url(#dots)" opacity=".55"/>
    <rect x="140" width="120" height="120" rx="26" fill="#3882F5"/><rect x="140" width="120" height="120" rx="26" fill="url(#lines)" opacity=".5"/>
    <rect y="140" width="120" height="120" rx="26" fill="#33BA5C"/><rect y="140" width="120" height="120" rx="26" fill="url(#vlines)" opacity=".5"/>
    <rect x="140" y="140" width="120" height="120" rx="26" fill="#F1F1F1" opacity=".12"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif">
    <text x="86" y="252" fill="#E94560" font-size="26" font-weight="700" letter-spacing="3">BLOCK BLAST · ACCESSIBLE EDITION</text>
    <text x="82" y="360" fill="#F1F1F1" font-size="86" font-weight="800" letter-spacing="-3">Play Without Limits</text>
    <text x="86" y="420" fill="#F1F1F1" fill-opacity=".62" font-size="30" font-weight="500">The block puzzle built for everyone —</text>
    <text x="86" y="464" fill="#F1F1F1" fill-opacity=".62" font-size="30" font-weight="500">sighted, blind, or colour blind.</text>
  </g>
</svg>
