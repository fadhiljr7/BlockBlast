<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- iOS applies its own rounding and never uses transparency, so this is a
       full-bleed square with a solid ground. -->
  <rect width="180" height="180" fill="#0A0A1A"/>
  <g transform="translate(22,22)">
    <rect x="0" y="0" width="62" height="62" rx="16" fill="#E94560"/>
    <g fill="#FFFFFF" opacity="0.85">
      <circle cx="18.6" cy="18.6" r="6.8"/><circle cx="43.4" cy="18.6" r="6.8"/>
      <circle cx="18.6" cy="43.4" r="6.8"/><circle cx="43.4" cy="43.4" r="6.8"/>
    </g>

    <rect x="74" y="0" width="62" height="62" rx="16" fill="#3A86FF"/>
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="81.4" y="12.4" width="47.2" height="7.4"/>
      <rect x="81.4" y="27.3" width="47.2" height="7.4"/>
      <rect x="81.4" y="42.2" width="47.2" height="7.4"/>
    </g>

    <rect x="0" y="74" width="62" height="62" rx="16" fill="#0EAD69"/>
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="12.4" y="81.4" width="7.4" height="47.2"/>
      <rect x="27.3" y="81.4" width="7.4" height="47.2"/>
      <rect x="42.2" y="81.4" width="7.4" height="47.2"/>
    </g>

    <rect x="75.5" y="75.5" width="59" height="59" rx="15" fill="none" stroke="#A0A0B0" stroke-width="5" stroke-dasharray="9 9"/>
  </g>
</svg>
